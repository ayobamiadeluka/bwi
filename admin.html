<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Ekiti State Women of Influence</title>

    <link rel="stylesheet" href="admin/admin.css">
</head>

<body>

    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="admin-logo">🔐</div>

            <h1>Admin Panel</h1>

            <p>
                Ekiti State Women of Influence<br>
                Ado Local Government
            </p>

            <form id="loginForm">

                <input
                    id="username"
                    type="text"
                    placeholder="Username"
                    required
                >

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <div id="loginError" class="error"></div>

            <a href="index.html">
                ← Back to Website
            </a>

        </div>

    </div>


    <script src="admin/admin.js"></script>

</body>
</html>
